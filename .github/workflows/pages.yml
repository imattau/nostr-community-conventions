name: Deploy NCC docs to GitHub Pages

# Builds a doc page for every top-level ncc-<number>/README.md and publishes
# them to GitHub Pages. Adding a new NCC needs no changes to this file: drop
# a new ncc-XX/ folder with a README.md, push to master, and its page appears
# automatically on the next run. See site/build.mjs for the discovery logic.

on:
  push:
    branches: [master]
    paths:
      - 'ncc-*/README.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site build dependencies
        working-directory: site
        run: npm ci

      - name: Build docs site
        run: node site/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
