name: Publish NCC events to Nostr

# Publishes NCC-00 documents, supporting documents, succession records, and
# endorsements. A release tag publishes that convention and its supporting
# documents; workflow_dispatch selects one of the other actions.
# Pull requests are checked separately by ncc-check.yml and never receive the
# signing key.

on:
  push:
    tags:
      - 'ncc-*'
  workflow_dispatch:
    inputs:
      action:
        description: 'What to publish'
        type: choice
        options:
          - document
          - supporting
          - succession
          - endorsement
          - latest
          - all
        default: document
      ncc:
        description: 'NCC identifier (e.g. ncc-02); empty means all for document/all'
        required: false
      version:
        description: 'Version override for a single document'
        required: false
      authoritative:
        description: 'Succession: authoritative document event id'
        required: false
      steward:
        description: 'Succession: optional steward pubkey or npub'
        required: false
      previous:
        description: 'Succession: optional previous event id'
        required: false
      effective_at:
        description: 'Succession: optional effective Unix timestamp'
        required: false
      endorse_event:
        description: 'Endorsement: document event id, or latest'
        required: false
      author:
        description: 'Latest/endorsement: document author pubkey or npub'
        required: false
      status:
        description: 'Endorsement: status (default published)'
        required: false
      role:
        description: 'Endorsement: role (author, client, or user); comma-separated'
        required: false
      implementation:
        description: 'Endorsement: implementation name or URL'
        required: false
      note:
        description: 'Endorsement: short note'
        required: false
      reason:
        description: 'Succession reason or document succession reason'
        required: false
      content:
        description: 'Event content; falls back to a default'
        required: false
      succession:
        description: 'Document action: publish a succession for the new document'
        type: boolean
        default: false
      dry_run:
        description: 'Print event templates without signing or publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ncc-publish
  cancel-in-progress: false

env:
  NSCRIPT_REPOSITORY: https://github.com/imattau/nscript
  NSCRIPT_REV: fb8cb889b55cdb19232801ebfca428e68bb78a76

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nscript-${{ env.NSCRIPT_REV }}

      - name: Install nscript
        run: cargo install --git "$NSCRIPT_REPOSITORY" --rev "$NSCRIPT_REV" --locked nscript-cli

      - name: Publish
        shell: bash
        env:
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
          NCC_RELAYS: ${{ vars.NCC_RELAYS }}
        run: |
          set -euo pipefail

          args=(--repo .)
          dry_run="${{ github.event.inputs.dry_run || 'false' }}"
          action="${{ github.event.inputs.action }}"
          command="publish"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            args+=(--tag "$tag" --published-at "$(git log -1 --format=%ct "$tag")" --supporting)
          else
            ncc="${{ github.event.inputs.ncc }}"
            version="${{ github.event.inputs.version }}"
            authoritative="${{ github.event.inputs.authoritative }}"
            steward="${{ github.event.inputs.steward }}"
            previous="${{ github.event.inputs.previous }}"
            effective_at="${{ github.event.inputs.effective_at }}"
            endorse_event="${{ github.event.inputs.endorse_event }}"
            author="${{ github.event.inputs.author }}"
            status="${{ github.event.inputs.status }}"
            role="${{ github.event.inputs.role }}"
            implementation="${{ github.event.inputs.implementation }}"
            note="${{ github.event.inputs.note }}"
            reason="${{ github.event.inputs.reason }}"
            content="${{ github.event.inputs.content }}"
            succession="${{ github.event.inputs.succession }}"

            if [[ -n "$version" && -z "$ncc" ]]; then
              echo "version requires an NCC identifier" >&2
              exit 1
            fi

            case "$action" in
              document)
                command="publish"
                if [[ -n "$ncc" ]]; then
                  args+=("$ncc")
                else
                  args+=(--all --include-drafts)
                fi
                if [[ -n "$version" ]]; then
                  args+=(--version "$version")
                fi
                args+=(--supporting)
                if [[ "$succession" == "true" ]]; then
                  if [[ -z "$ncc" ]]; then
                    echo "succession requires an NCC identifier" >&2
                    exit 1
                  fi
                  args+=(--succession)
                  if [[ -n "$reason" ]]; then
                    args+=(--succession-reason "$reason")
                  fi
                  if [[ -n "$content" ]]; then
                    args+=(--succession-content "$content")
                  fi
                fi
                ;;
              supporting)
                command="support"
                if [[ -n "$ncc" ]]; then
                  args+=(--ncc "$ncc")
                else
                  args+=(--all)
                fi
                ;;
              succession)
                command="succession"
                if [[ -z "$ncc" || -z "$authoritative" ]]; then
                  echo "succession requires ncc and authoritative" >&2
                  exit 1
                fi
                args+=(--ncc "$ncc" --authoritative "$authoritative")
                if [[ -n "$author" ]]; then
                  args+=(--author "$author")
                fi
                if [[ -n "$steward" ]]; then
                  args+=(--steward "$steward")
                fi
                if [[ -n "$previous" ]]; then
                  args+=(--previous "$previous")
                fi
                if [[ -n "$reason" ]]; then
                  args+=(--reason "$reason")
                fi
                if [[ -n "$effective_at" ]]; then
                  args+=(--effective-at "$effective_at")
                fi
                if [[ -n "$content" ]]; then
                  args+=(--content "$content")
                fi
                ;;
              endorsement)
                command="endorse"
                if [[ -z "$ncc" || -z "$endorse_event" ]]; then
                  echo "endorsement requires ncc and endorse_event" >&2
                  exit 1
                fi
                args+=(--ncc "$ncc" --event "$endorse_event")
                if [[ -n "$author" ]]; then
                  args+=(--author "$author")
                fi
                if [[ -n "$status" ]]; then
                  args+=(--status "$status")
                fi
                if [[ -n "$role" ]]; then
                  IFS=',' read -ra roles <<< "$role"
                  for item in "${roles[@]}"; do
                    item="${item//[[:space:]]/}"
                    if [[ -n "$item" ]]; then
                      args+=(--role "$item")
                    fi
                  done
                fi
                if [[ -n "$implementation" ]]; then
                  args+=(--implementation "$implementation")
                fi
                if [[ -n "$note" ]]; then
                  args+=(--note "$note")
                fi
                if [[ -n "$content" ]]; then
                  args+=(--content "$content")
                fi
                ;;
              latest)
                command="latest"
                if [[ -z "$ncc" ]]; then
                  echo "latest requires an NCC identifier" >&2
                  exit 1
                fi
                args+=(--ncc "$ncc")
                if [[ -n "$author" ]]; then
                  args+=(--author "$author")
                fi
                relays="${NCC_RELAYS:-wss://relay.damus.io,wss://relay.primal.net,wss://nos.lol,wss://relay.nostr.band,wss://nostr-01.yakihonne.com,wss://relay.ditto.pub}"
                IFS=',' read -ra relay_list <<< "$relays"
                for relay in "${relay_list[@]}"; do
                  relay="${relay//[[:space:]]/}"
                  if [[ -n "$relay" ]]; then
                    args+=(--relay "$relay")
                  fi
                done
                nscript ncc latest "${args[@]}" --json
                exit 0
                ;;
              all)
                command="publish"
                args+=(--all --include-drafts --supporting)
                ;;
              *)
                echo "unknown action: $action" >&2
                exit 1
                ;;
            esac
          fi

          if [[ "$dry_run" == "true" ]]; then
            args+=(--dry-run --json)
            nscript ncc "$command" "${args[@]}"
            exit 0
          fi

          if [[ -z "${NGIT_NSEC:-}" ]]; then
            echo "Repository secret NGIT_NSEC is required." >&2
            exit 1
          fi

          relays="${NCC_RELAYS:-wss://relay.damus.io,wss://relay.primal.net,wss://nos.lol,wss://relay.nostr.band,wss://nostr-01.yakihonne.com,wss://relay.ditto.pub}"
          IFS=',' read -ra relay_list <<< "$relays"
          for relay in "${relay_list[@]}"; do
            relay="${relay//[[:space:]]/}"
            if [[ -n "$relay" ]]; then
              args+=(--relay "$relay")
            fi
          done

          args+=(--signer-key-env NGIT_NSEC --require-accepted 1)
          nscript ncc "$command" "${args[@]}"
