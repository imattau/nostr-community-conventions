name: Publish npm package

on:
  push:
    tags:
      - 'npm-*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package from release tag
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            npm-ncc-02-js-v*) PACKAGE_DIR=ncc-02/ncc-02-js; PACKAGE_NAME=ncc-02-js; TAG_PREFIX=npm-ncc-02-js-v ;;
            npm-nostr-election-36998-v*) PACKAGE_DIR=ncc-03; PACKAGE_NAME=nostr-election-36998; TAG_PREFIX=npm-nostr-election-36998-v ;;
            npm-ncc-05-js-v*) PACKAGE_DIR=ncc-05/ncc-05-js; PACKAGE_NAME=ncc-05-js; TAG_PREFIX=npm-ncc-05-js-v ;;
            npm-ncc-06-js-v*) PACKAGE_DIR=ncc-06/ncc-06-js; PACKAGE_NAME=ncc-06-js; TAG_PREFIX=npm-ncc-06-js-v ;;
            npm-ncc-sidecar-v*) PACKAGE_DIR=ncc-06/ncc-sidecar; PACKAGE_NAME=ncc-sidecar; TAG_PREFIX=npm-ncc-sidecar-v ;;
            npm-ncc-07-js-v*) PACKAGE_DIR=ncc-07/ncc-07-js; PACKAGE_NAME=ncc-07-js; TAG_PREFIX=npm-ncc-07-js-v ;;
            npm-ncc-08-js-v*) PACKAGE_DIR=ncc-08/ncc-08-js; PACKAGE_NAME=ncc-08-js; TAG_PREFIX=npm-ncc-08-js-v ;;
            npm-ncc-09-js-v*) PACKAGE_DIR=ncc-09/ncc-09-js; PACKAGE_NAME=ncc-09-js; TAG_PREFIX=npm-ncc-09-js-v ;;
            npm-ncc-10-js-v*) PACKAGE_DIR=ncc-10/ncc-10-js; PACKAGE_NAME=ncc-10-js; TAG_PREFIX=npm-ncc-10-js-v ;;
            npm-ncc-11-js-v*) PACKAGE_DIR=ncc-11/ncc-11-js; PACKAGE_NAME=ncc-11-js; TAG_PREFIX=npm-ncc-11-js-v ;;
            npm-ncc-13-js-v*) PACKAGE_DIR=ncc-13/ncc-13-js; PACKAGE_NAME=ncc-13-js; TAG_PREFIX=npm-ncc-13-js-v ;;
            npm-ncc-manager-v*) PACKAGE_DIR=ncc-manager; PACKAGE_NAME=@0xx0lostcause0xx0/ncc-manager; TAG_PREFIX=npm-ncc-manager-v ;;
            *) echo "Unsupported npm release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

          TAG_VERSION="${RELEASE_TAG#"$TAG_PREFIX"}"

          echo "directory=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Verify package name and version
        working-directory: ${{ steps.package.outputs.directory }}
        env:
          EXPECTED_NAME: ${{ steps.package.outputs.name }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== process.env.EXPECTED_NAME) {
            throw new Error(`Tag package ${process.env.EXPECTED_NAME} does not match ${pkg.name}`);
          }
          if (pkg.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Tag version ${process.env.EXPECTED_VERSION} does not match ${pkg.version}`);
          }
          NODE

      - name: Install dependencies
        working-directory: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          # Libraries may deliberately gitignore their lockfile; npm ci requires one.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build and test
        working-directory: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          if [ "${{ steps.package.outputs.name }}" = "ncc-sidecar" ]; then
            npm --prefix ui ci
            npm --prefix ui run build
          fi
          npm run build --if-present
          npm run test --if-present

      - name: Publish to npm
        working-directory: ${{ steps.package.outputs.directory }}
        run: npm publish --access public
