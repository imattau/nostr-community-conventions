name: Sync GitHub refs to ngit

# One-way sync from this GitHub repository to its ngit repository. Keep the
# Nostr repository as the canonical copy and do not merge independently on
# GitHub; divergent refs require manual reconciliation.
on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ngit-sync
  cancel-in-progress: false

jobs:
  sync:
    # Never expose the Nostr signer to untrusted pull request code.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: danconwaydev/setup-ngit@v3
        with:
          version: 3.2.0

      - name: Configure ngit signer
        env:
          NGIT_REPOSITORY: nostr://npub1khf5amw8mrupe649a5mhkk3d2d8wjj06urz6kwawpftk4f68tjlstdmd3q/relay.ngit.dev/nostr-community-conventions
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
        run: |
          set -euo pipefail
          if [ -z "$NGIT_NSEC" ]; then
            echo "Repository secret NGIT_NSEC must contain the authorized Nostr private key for this mirror." >&2
            exit 1
          fi
          key_file="$(mktemp)"
          chmod 600 "$key_file"
          printf '%s\n' "$NGIT_NSEC" > "$key_file"
          echo "NGIT_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "NGIT_REPOSITORY=$NGIT_REPOSITORY" >> "$GITHUB_ENV"

      - name: Push master branch and tags to ngit
        run: |
          set -euo pipefail
          key_file="$NGIT_KEY_FILE"
          cleanup() {
            git config --unset nostr.nsec 2>/dev/null || true
            rm -f "$key_file"
          }
          trap cleanup EXIT
          git config nostr.nsec "$(cat "$key_file")"
          git config nostr.repo-relay-only true
          git remote add ngit "$NGIT_REPOSITORY"
          git fetch --no-tags origin master
          master_sha="$(git rev-parse origin/master)"
          git push ngit "${master_sha}:refs/heads/master"
          git push ngit --tags
          remote_master="$(git ls-remote ngit refs/heads/master | awk '$2 == "refs/heads/master" { print $1 }')"
          if [ "$remote_master" != "$master_sha" ]; then
            echo "ngit mirror master is ${remote_master:-missing}, expected $master_sha" >&2
            exit 1
          fi

      - name: Remove temporary signer file
        if: always()
        run: |
          if [ -n "${NGIT_KEY_FILE:-}" ]; then
            rm -f "$NGIT_KEY_FILE"
          fi
